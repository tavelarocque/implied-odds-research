# Cloud data collection (schedule re-registered 2026-10-05): runs on GitHub's servers, so no laptop needs to be on.
# Every 30 minutes on weekdays across US market hours (13:15 to 21:45 UTC covers both daylight and standard time),
# it takes a matched snapshot of SPX and NDX options, Kalshi's daily ladders and Polymarket's daily order books; on the last runs of the day it also saves a week of
# one-minute S&P prices. Results are committed to the `data` branch, kept separate from the code on `main`.
name: snapshot

on:
  schedule:
    - cron: "15,45 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Options, Kalshi and Polymarket snapshot
        env:
          SNAP_MAX_DAYS: "10"
          SNAP_MAX_MONEYNESS: "0.08"
        run: |
          cd collect
          python options_snapshot.py
          python kalshi_snapshot.py
          python polymarket_snapshot.py

      - name: Paper trade (layer 5 rule, decisions only)
        continue-on-error: true
        run: |
          pip install --quiet numpy pandas scipy
          python trade/paper.py live
      - name: One-minute S&P prices (late-day runs, and manual test runs)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule != ''
        run: |
          if [ "$(date -u +%H)" -ge 21 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pip install --quiet yfinance
            cd collect && python intraday.py
          fi

      - name: Save to the data branch
        run: |
          git config user.name "implied-odds-collector"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q origin data
            git worktree add -q store FETCH_HEAD
            cd store && git checkout -q -B data
          else
            git worktree add -q --detach store
            cd store && git checkout -q --orphan data && git rm -rfq . && rm -rf ./*
          fi
          mkdir -p data/raw
          cp -r ../data/raw/* data/raw/
          git add -f data/raw
          git commit -qm "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nothing new"; exit 0; }
          for i in 1 2 3; do git push -q origin data && break; git pull -q --rebase origin data; done
          du -sh data/raw
